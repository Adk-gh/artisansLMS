<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | Course Materials</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/client/assets/css/style.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: 'Sora', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; }

        #content { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 1.5rem !important; }

        @media (min-width: 768px) {
            #content { margin-left: 260px !important; transition: margin-left .28s cubic-bezier(0.4, 0, 0.2, 1); }
            body.sidebar-collapsed #content { margin-left: 68px !important; }
        }

        #header-container { position: relative; z-index: 1050; }

        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important; }

        .search-wrap { position: relative; max-width: 400px; width: 100%; }
        .search-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-wrap input { padding-left: 44px; border-radius: 12px; }

        .file-link { cursor: pointer; transition: color 0.2s ease; word-break: break-all; }
        .file-link:hover { color: #0ea5e9 !important; }

        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; transition: all 0.2s ease; cursor: pointer; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #0ea5e9; background-color: #f0f9ff !important; }

        #fileViewerFrame { width: 100%; height: 75vh; min-height: 500px; border: none; }

        .grid-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
            padding-bottom: 20px;
            padding-right: 5px;
        }
        .grid-scroll-wrapper::-webkit-scrollbar { width: 6px; }
        .grid-scroll-wrapper::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        .resource-list-wrapper {
            max-height: 180px;
            overflow-y: auto;
            scrollbar-width: thin;
            padding-right: 4px;
        }
        .resource-list-wrapper::-webkit-scrollbar { width: 4px; }
        .resource-list-wrapper::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        .dropdown-container { overflow: visible !important; }
        .dropdown-menu { z-index: 9999 !important; }
    </style>
</head>
<body>

    <div class="d-flex min-vh-100 overflow-hidden">
        <div id="sidebar-container"></div>
        <div id="content" class="flex-grow-1 w-100">

            <div id="header-container" class="flex-shrink-0"></div>

            <main class="container-fluid p-3 p-md-4 p-lg-5 d-flex flex-column">
                <div id="alertsContainer" class="flex-shrink-0"></div>

                <div class="mb-4 mb-md-5 flex-shrink-0">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="courseSearch" class="form-control border-light-subtle shadow-sm bg-white py-2"
                               placeholder="Search courses..." oninput="filterCourses()">
                    </div>
                </div>

                <div class="grid-scroll-wrapper">
                    <div class="row g-4 m-0" id="courseGrid">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div class="text-muted small fw-bold mt-2">Loading your courses...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- View File Modal -->
    <div class="modal fade" id="viewFileModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4 bg-dark">
                <div class="modal-header border-0 py-3">
                    <h6 class="modal-title fw-bold text-white" id="viewFileName">File Preview</h6>
                    <button type="button" title="Close" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0 bg-white rounded-bottom-4 position-relative">
                    <div id="fileViewerContainer" style="width:100%;min-height:500px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="fas fa-upload me-2 text-primary"></i> Upload Resource
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="Close"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <input type="hidden" id="res_course_id">
                    <div id="dropZone" class="drop-zone text-center bg-light px-3 py-4 mb-3"
                         onclick="document.getElementById('res_file_input').click()">
                        <i class="fas fa-cloud-upload-alt fa-2x text-primary mb-2 opacity-75"></i>
                        <div class="fw-semibold text-muted small" id="dropZoneLabel">Click to browse or drag &amp; drop</div>
                        <div class="text-muted mt-1" id="dropZoneFileName" style="font-size:.8rem;"></div>
                    </div>
                    <input type="file" id="res_file_input" class="d-none" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.png,.jpg,.jpeg,.mp4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Title <span class="text-danger">*</span></label>
                        <input type="text" id="res_custom_name" class="form-control rounded-3 border-light-subtle shadow-sm"
                               placeholder="e.g. Week 1 Lecture Notes">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Description <span class="text-muted fw-normal">(optional)</span></label>
                        <textarea id="res_file_desc" class="form-control rounded-3 border-light-subtle shadow-sm"
                                  rows="2" placeholder="Brief description of this resource..."></textarea>
                    </div>
                    <div id="uploadProgressWrap" style="display:none;" class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <small class="text-muted fw-semibold" id="uploadStatusText">Uploading...</small>
                            <small class="fw-bold text-primary" id="uploadPct">0%</small>
                        </div>
                        <div class="progress rounded-pill" style="height:8px;">
                            <div id="uploadProgressBar"
                                 class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
                                 style="width:0%;transition:width .3s ease;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pt-0 pb-4 gap-2">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="uploadSubmitBtn"
                            class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm"
                            onclick="submitResourceUpload()">
                        <i class="fas fa-upload me-2"></i> Upload to Course
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="fas fa-edit me-2 text-info"></i> Edit Resource
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="Close"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-2">
                    <input type="hidden" id="edit_res_id">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Title <span class="text-danger">*</span></label>
                        <input type="text" id="edit_res_name" class="form-control rounded-3 border-light-subtle shadow-sm"
                               placeholder="Resource title">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Description</label>
                        <textarea id="edit_res_desc" class="form-control rounded-3 border-light-subtle shadow-sm"
                                  rows="2" placeholder="Brief description..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pt-0 pb-4 gap-2">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info text-white rounded-pill px-4 fw-bold shadow-sm"
                            onclick="submitEditResource()">
                        <i class="fas fa-save me-2"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold text-dark d-flex align-items-center">
                        <i class="far fa-trash-alt text-danger me-2"></i> Delete Resource
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="Close"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-3">
                    <p class="text-muted mb-0" style="font-size: 0.95rem;">
                        Are you sure you want to permanently delete
                        <strong>"<span id="deleteFileName" class="text-dark"></span>"</strong>? This action cannot be undone.
                    </p>
                </div>
                <div class="modal-footer border-0 px-4 pt-0 pb-4 d-flex flex-column align-items-end gap-2">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold border-0" style="background-color: #f8f9fa;" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" id="deleteConfirmBtn" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                        <i class="far fa-trash-alt me-1"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#sidebar-container").load("../components/sidebar.html");
            $("#header-container").load("../components/header.html", function(res, status) {
                if (status !== 'error' && typeof window.initHeader === 'function') {
                    window.initHeader();
                }
            });
        });
    </script>
    <script type="module" src="/client/assets/js/modules/instructor_courses.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: 'Sora', sans-serif;
            background: #f0f2f7;
        }

        /* ── Tabs Navigation ── */
        .arch-tab-container {
            background: #fff; border: 1px solid #e9ecef; border-radius: 14px;
            padding: 8px; display: inline-flex; gap: 4px; overflow-x: auto;
            max-width: 100%; margin-bottom: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.02);
        }
        .arch-tab {
            border-radius: 10px; font-weight: 600; font-size: .85rem; color: #64748b;
            padding: 10px 18px; transition: .2s; border: none; background: transparent;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer;
        }
        .arch-tab:hover { background: #f8fafc; color: #1e293b; }
        .arch-tab.active { background: #1e293b; color: #fff; }

        .arch-tab .badge { font-size: .7rem; padding: 4px 8px; border-radius: 6px; transition: .2s; }
        .arch-tab.active .badge { background: rgba(255,255,255,0.2) !important; color: #fff !important; border: none !important; }
        .arch-tab:not(.active) .badge { background: #e2e8f0 !important; color: #475569 !important; border: none !important; }

        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── Search & Filter bar (SF-Bar) ── */
        .sf-bar {
            background: #fff; border: 1px solid #e9ecef; border-radius: 14px;
            padding: 14px 18px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .sf-search-wrap { position: relative; flex: 1; min-width: 250px; }
        .sf-search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: .8rem; pointer-events: none; }
        .sf-input {
            width: 100%; padding: 10px 14px 10px 38px;
            border: 1.5px solid #e9ecef; border-radius: 10px;
            font-size: .82rem; font-family: 'Sora', sans-serif;
            color: #1e293b; background: #f8fafc; outline: none; transition: .2s;
        }
        .sf-input:focus { border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 3px rgba(14,165,233,.08); }

        /* Filter Chips */
        .arch-filter-chip {
            padding: 8px 16px; border-radius: 20px; font-size: .75rem; font-weight: 700;
            background: #f8fafc; color: #64748b; border: 1.5px solid #e2e8f0; cursor: pointer;
            transition: .2s; white-space: nowrap;
        }
        .arch-filter-chip:hover { background: #e2e8f0; color: #1e293b; }
        .arch-filter-chip.factive { background: #1e293b; color: #fff; border-color: #1e293b; }

        .sf-count { font-size: .75rem; font-weight: 700; color: #94a3b8; white-space: nowrap; margin-left: auto; }
        .sf-count span { color: #0ea5e9; }

        /* ── Dynamic Table Styling ── */
        #tableContainer {
            background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden;
        }
        #tableContainer table { width: 100%; margin-bottom: 0; }
        #tableContainer thead th {
            background: #f8fafc; font-size: .7rem; text-transform: uppercase;
            color: #64748b; font-weight: 700; padding: 14px 20px; border-bottom: 2px solid #f1f5f9; border-top: none;
        }
        #tableContainer tbody td {
            padding: 16px 20px; vertical-align: middle; border-bottom: 1px solid #f1f5f9;
            font-size: .85rem; color: #1e293b;
        }
        #tableContainer tbody tr:hover { background: #f8fafc; }

        /* ── Action Buttons (Matching Instructors Page) ── */
        .btn-action {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 8px; font-size: .72rem; font-weight: 700;
            cursor: pointer; transition: .15s; text-decoration: none; border: 1px solid transparent;
            font-family: 'Sora', sans-serif;
        }

        /* Restore Style (Green) */
        .btn-restore { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
        .btn-restore:hover { background: #dcfce7; color: #166534; }

        /* Delete Style (Red) */
        .btn-delete { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .btn-delete:hover { background: #fee2e2; color: #991b1b; }

        /* ── Confirm Modal ── */
        .arch-modal-backdrop {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(15,23,42,.45); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn .15s ease;
        }
        .arch-modal {
            background: #fff; border-radius: 18px; padding: 28px 28px 22px;
            width: 100%; max-width: 400px; margin: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.18);
            animation: slideUp .2s ease;
        }
        .arch-modal-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin-bottom: 16px;
        }
        .arch-modal-icon.danger  { background: #fef2f2; color: #dc2626; }
        .arch-modal-icon.success { background: #f0fdf4; color: #16a34a; }
        .arch-modal-title   { font-size: .95rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .arch-modal-message { font-size: .8rem; color: #64748b; line-height: 1.5; margin-bottom: 22px; }
        .arch-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .arch-modal-cancel {
            padding: 9px 20px; border-radius: 10px; font-size: .8rem; font-weight: 700;
            background: #f8fafc; color: #475569; border: 1.5px solid #e2e8f0; cursor: pointer;
            font-family: 'Sora', sans-serif; transition: .15s;
        }
        .arch-modal-cancel:hover { background: #e2e8f0; }
        .arch-modal-confirm {
            padding: 9px 20px; border-radius: 10px; font-size: .8rem; font-weight: 700;
            border: none; cursor: pointer; font-family: 'Sora', sans-serif; transition: .15s;
        }
        .arch-modal-confirm.danger  { background: #dc2626; color: #fff; }
        .arch-modal-confirm.danger:hover  { background: #b91c1c; }
        .arch-modal-confirm.success { background: #16a34a; color: #fff; }
        .arch-modal-confirm.success:hover { background: #15803d; }
        @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Mobile Adjustments */
        @media (max-width:576px) {
            .sf-bar { padding: 12px 14px; gap: 10px; }
            .arch-tab { font-size: .8rem; padding: 8px 12px; }
            .arch-filter-chip { padding: 6px 12px; font-size: .7rem; }
            .sf-count { width: 100%; text-align: center; margin-left: 0; }
            .arch-modal { padding: 22px 18px 18px; }
        }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>

    <div id="content" class="min-vh-100">
        <div id="header-placeholder"></div>

        <main class="p-4 p-md-5">

            <!-- Tab Navigation Container -->
            <div class="arch-tab-container no-scrollbar">
                <button class="arch-tab active" data-tab="classes" onclick="switchTab('classes')">
                    <i class="fas fa-door-open"></i> Classes
                    <span class="badge tab-count">0</span>
                </button>
                <button class="arch-tab" data-tab="students" onclick="switchTab('students')">
                    <i class="fas fa-user-graduate"></i> Students
                    <span class="badge tab-count">0</span>
                </button>
                <button class="arch-tab" data-tab="courses" onclick="switchTab('courses')">
                    <i class="fas fa-layer-group"></i> Courses
                    <span class="badge tab-count">0</span>
                </button>
                <button class="arch-tab" data-tab="instructors" onclick="switchTab('instructors')">
                    <i class="fas fa-user-tie"></i> Instructors
                    <span class="badge tab-count">0</span>
                </button>
                <button class="arch-tab" data-tab="enrollments" onclick="switchTab('enrollments')">
                    <i class="fas fa-link"></i> Enrollments
                    <span class="badge tab-count">0</span>
                </button>
            </div>

            <!-- Search & Filter Bar (SF-Bar) -->
            <div class="sf-bar" id="archFilterBar">
                <div class="sf-search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="archSearch" class="sf-input" placeholder="Search archived records…">
                </div>

                <div class="d-flex align-items-center gap-2 overflow-auto no-scrollbar">
                    <span class="arch-filter-chip factive" onclick="setDateFilter(this,'all')">All Time</span>
                    <span class="arch-filter-chip" onclick="setDateFilter(this,'today')">Today</span>
                    <span class="arch-filter-chip" onclick="setDateFilter(this,'week')">This Week</span>
                    <span class="arch-filter-chip" onclick="setDateFilter(this,'month')">This Month</span>
                </div>

                <div class="sf-count">
                    <span id="archResultCount">0</span> records found
                </div>
            </div>

            <!-- Table Container -->
            <div id="tableContainer" class="shadow-sm">
                <div class="text-center py-5 text-muted fw-bold">
                    <div class="spinner-border spinner-border-sm mb-3 text-primary" style="width: 1.5rem; height: 1.5rem;"></div><br>
                    <span style="font-size: .9rem;">Loading archives...</span>
                </div>
            </div>

        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            $("#sidebar-placeholder").load("../components/sidebar.html");
            $("#header-placeholder").load("../components/header.html", function(res, status) {
                if (status !== 'error' && typeof initHeader === 'function') initHeader();
            });
        });
    </script>

    <script src="/client/assets/js/modules/archived.js"></script>
</body>
</html>

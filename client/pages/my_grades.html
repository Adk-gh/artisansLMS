<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | My Grades</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/client/assets/css/style.css">
    <style>
        /* ── Layout Constraint (Freezes the page) ── */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: 'Sora', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; }

        #content { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1.5rem !important;
        }

        @media (min-width: 768px) { #content { margin-left: 260px !important; transition: margin-left .28s; } }

        /* Card Hover Effect */
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important; }

        /* ── Matching Analytics Player Card Style ── */
        .player-card {
            background: #0f172a;
            color: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .player-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 300px; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: .08;
            pointer-events: none;
        }
        .stat-highlight { color: #0ea5e9; }

        /* ── Scrollable Grid Wrapper ── */
        .grid-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
            padding-bottom: 2rem;
            padding-right: 5px; /* Prevent scrollbar from overlapping cards */
        }
        .grid-scroll-wrapper::-webkit-scrollbar { width: 6px; }
        .grid-scroll-wrapper::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* ── Grade Card Styles ── */
        .grade-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .score-ring {
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0; border: 4px solid;
        }
        .ring-none    { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }
        .ring-excellent{ background: #f0fdf4; color: #15803d; border-color: #4ade80; }
        .ring-good    { background: #eff6ff; color: #1d4ed8; border-color: #60a5fa; }
        .ring-average { background: #fefce8; color: #a16207; border-color: #facc15; }
        .ring-poor    { background: #fef2f2; color: #b91c1c; border-color: #f87171; }
    </style>
</head>
<body>

    <div class="d-flex min-vh-100 overflow-hidden w-100">

        <div id="sidebar-container"></div>

        <div id="content" class="flex-grow-1 w-100">

            <!-- Fixed Header -->
            <div id="header-container" class="flex-shrink-0"></div>

            <main class="container-fluid p-3 p-md-4 p-lg-5">

                <!-- Fixed Top Card -->
                <div class="player-card mb-4 p-4 p-md-5 shadow-sm flex-shrink-0">
                    <div class="d-flex flex-wrap justify-content-between align-items-center position-relative" style="z-index: 1;">
                        <div class="d-flex gap-4 text-center mt-4 mt-md-0">
                            <div>
                                <div class="fs-2 fw-bolder stat-highlight" id="overallAvg">0%</div>
                                <div class="small text-uppercase text-light opacity-75 fw-bold mt-1" style="letter-spacing: 0.5px;">Overall Avg</div>
                            </div>
                            <div class="border-start border-secondary ps-4">
                                <div class="fs-2 fw-bolder stat-highlight" id="totalClasses">0</div>
                                <div class="small text-uppercase text-light opacity-75 fw-bold mt-1" style="letter-spacing: 0.5px;">Classes</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Scrollable Grid -->
                <div class="grid-scroll-wrapper">
                    <div class="row g-4 m-0" id="gradesGrid">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div class="text-muted small fw-bold mt-2">Loading Grades...</div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4 bg-light">
                <div class="modal-header border-0 pb-0 pt-4 px-4 bg-white rounded-top-4">
                    <h5 class="fw-bold m-0" id="modalTitle">Course Details</h5>
                    <button type="button" title="Close" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 bg-white rounded-bottom-4" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/client/assets/js/modules/my_grades.js"></script>
</body>
</html>
